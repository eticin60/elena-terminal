// Ensure ?api= parameter is preserved when clicking Back to Terminal
function getTerminalUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  let api = urlParams.get("api");
  if (!api && window.location.hash) {
    const match = window.location.href.match(/[?&#]api=([^&#]+)/);
    if (match && match[1]) api = decodeURIComponent(match[1]);
  }
  if (!api) api = localStorage.getItem("elena_api_base") || "";
  return api ? `index.html?api=${encodeURIComponent(api)}` : "index.html";
}
const backBtn = document.getElementById("btn-back");
if (backBtn) backBtn.href = getTerminalUrl();

function renderTerms(lang) {
  const data = TERMS[lang] || TERMS.ru;
  const area = document.getElementById("content-area");
  let html = `
    <div class="legal-card banner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <span class="warn-badge">⚠️ ${data.badge}</span>
        <span style="font-size:11px;color:var(--text-muted)">${data.updated}</span>
      </div>
      <h1 style="font-size:18px;font-weight:800;color:#fff;margin:0 0 8px">${data.title}</h1>
      <p style="color:var(--text-secondary);font-size:13px;line-height:1.6">${data.desc}</p>
    </div>
  `;

  data.sections.forEach((s, idx) => {
    html += `
      <div class="legal-card" style="animation-delay: ${idx * 0.05}s">
        <h2><span>${s.icon}</span> ${s.h}</h2>
        <p>${s.p}</p>
      </div>
    `;
  });

  area.innerHTML = html;
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    localStorage.setItem("elena_lang", btn.dataset.lang);
    renderTerms(btn.dataset.lang);
  });
});

const defaultLang = localStorage.getItem("elena_lang") || "ru";
const activeBtn = document.querySelector(`.lang-btn[data-lang="${defaultLang}"]`) || document.querySelector('.lang-btn[data-lang="ru"]');
if (activeBtn) activeBtn.click(); else renderTerms("ru");
</script>
